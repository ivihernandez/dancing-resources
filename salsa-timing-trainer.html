<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salsa Timing Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0f; --bg2: #141418; --surface: #1a1a20;
  --fg: #e8e6e3; --fg-dim: #8a8892; --fg-muted: #4a4854;
  --border: #2a2830;
  --strong: #ff3b3b; --strong-g: rgba(255,59,59,.4);
  --medium: #ffb800; --medium-g: rgba(255,184,0,.35);
  --regular: #818cf8; --regular-g: rgba(129,140,248,.35);
  --hit: #34d399; --hit-g: rgba(52,211,153,.35);
  --miss: #ff3b3b;
  --wave-strong: #ff4d4d; --wave-medium: #ffc233; --wave-regular: #a78bfa; --wave-pause: #555;
  --ff-d: 'Space Grotesk', system-ui, sans-serif;
  --ff-b: 'Inter', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f3f0; --bg2: #edeae6; --surface: #fff;
    --fg: #1a1818; --fg-dim: #6b6570; --fg-muted: #b0a8b8;
    --border: #ddd8d2;
    --strong: #dc2626; --strong-g: rgba(220,38,38,.2);
    --medium: #d97706; --medium-g: rgba(217,119,6,.15);
    --regular: #6366f1; --regular-g: rgba(99,102,241,.15);
    --hit: #16a34a; --hit-g: rgba(22,163,74,.15);
    --wave-strong: #ef4444; --wave-medium: #f59e0b; --wave-regular: #818cf8; --wave-pause: #ccc;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f3f0; --bg2: #edeae6; --surface: #fff;
  --fg: #1a1818; --fg-dim: #6b6570; --fg-muted: #b0a8b8;
  --border: #ddd8d2;
  --strong: #dc2626; --strong-g: rgba(220,38,38,.2);
  --medium: #d97706; --medium-g: rgba(217,119,6,.15);
  --regular: #6366f1; --regular-g: rgba(99,102,241,.15);
  --hit: #16a34a; --hit-g: rgba(22,163,74,.15);
  --wave-strong: #ef4444; --wave-medium: #f59e0b; --wave-regular: #818cf8; --wave-pause: #ccc;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--ff-b); min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
}
.app {
  max-width: 1100px; margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-left, 0px)) 40px;
}
h1 {
  font-family: var(--ff-d); font-size: 1.5rem; font-weight: 700;
  letter-spacing: .12em; text-align: center; color: var(--strong);
}
.subtitle {
  text-align: center; font-size: .72rem; color: var(--fg-dim);
  letter-spacing: .04em; margin-top: 2px;
}

/* Two-column layout */
.layout {
  display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 16px;
}
@media (min-width: 760px) {
  .layout { grid-template-columns: 1fr 340px; }
}
.main-col { min-width: 0; }
.side-col { min-width: 0; }

/* Now playing */
.now-playing {
  font-size: .82rem; color: var(--medium);
  font-weight: 600; min-height: 22px;
  opacity: 0; transition: opacity .3s;
  margin-bottom: 8px;
}
.now-playing.visible { opacity: 1; }

/* YouTube player area */
.yt-wrap {
  border-radius: 12px; overflow: hidden;
  background: #000; position: relative;
  aspect-ratio: 16 / 9;
}
.yt-wrap iframe { width: 100%; height: 100%; border: 0; }
.yt-placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--fg-dim); font-size: .85rem;
  text-align: center; padding: 16px;
}

/* Transport controls */
.transport {
  display: flex; gap: 8px; justify-content: center;
  align-items: center; margin-top: 12px;
}
.transport-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--surface);
  color: var(--fg); cursor: pointer; transition: all .15s;
  font-size: 0;
}
.transport-btn:hover { border-color: var(--fg-dim); background: var(--bg2); }
.transport-btn.play-btn {
  width: 56px; height: 56px;
  border-color: var(--strong); background: var(--strong);
  color: #fff;
}
.transport-btn.play-btn:hover { background: #e02020; border-color: #e02020; }
.transport-btn svg { width: 20px; height: 20px; fill: currentColor; }
.transport-btn.play-btn svg { width: 24px; height: 24px; }

/* Time bar */
.time-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .72rem; color: var(--fg-dim); margin: 8px 0 0;
  font-variant-numeric: tabular-nums;
}
.time-bar .progress-wrap {
  flex: 1; margin: 0 10px; height: 6px;
  background: var(--border); border-radius: 3px;
  cursor: pointer; position: relative;
  padding: 10px 0;
  background-clip: content-box;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.time-bar .progress-fill {
  height: 6px; background: var(--strong); border-radius: 3px;
  width: 0; pointer-events: none; position: relative; top: 10px;
}
.time-bar .progress-wrap .seek-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--strong); position: absolute;
  top: 50%; transform: translate(-50%, -50%);
  pointer-events: none; opacity: 0; transition: opacity .15s;
}
.time-bar .progress-wrap:hover .seek-thumb,
.time-bar .progress-wrap.dragging .seek-thumb { opacity: 1; }

/* Waveform canvas */
.wave-wrap {
  margin-top: 12px; border-radius: 10px; overflow: hidden;
  background: var(--bg2); border: 1px solid var(--border);
}
canvas#waveform { display: block; width: 100%; height: 120px; }

/* Beat display */
.beat-display { margin-top: 10px; text-align: center; }
.beat-num {
  font-family: var(--ff-d); font-size: 3rem; font-weight: 700;
  line-height: 1; min-height: 50px;
  transition: color .1s;
}
.beat-label {
  font-size: .68rem; color: var(--fg-dim); letter-spacing: .06em;
  text-transform: uppercase; margin-top: 2px;
}

/* Beat strip */
.beat-strip {
  display: flex; gap: 4px; justify-content: center; margin-top: 8px;
}
.beat-pip {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-d); font-size: .72rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg-muted); transition: all .12s;
}
.beat-pip.active { transform: scale(1.18); border-color: transparent; }
.beat-pip.b1.active { background: var(--strong); color: #fff; }
.beat-pip.b5.active { background: var(--medium); color: #fff; }
.beat-pip.step.active { background: var(--regular); color: #fff; }
.beat-pip.pause.active { background: var(--fg-muted); color: var(--bg); }

/* Tap section */
.tap-section {
  margin-top: 14px; text-align: center;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 12px;
}
.tap-title {
  font-family: var(--ff-d); font-size: .78rem; font-weight: 600;
  color: var(--fg-dim); letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 8px;
}
.tap-btn {
  width: 100%; max-width: 320px; padding: 16px 20px;
  border: none; border-radius: 12px; cursor: pointer;
  font-family: var(--ff-d); font-size: 1.2rem; font-weight: 700;
  letter-spacing: .06em; color: #fff;
  background: linear-gradient(135deg, var(--strong) 0%, #b91c1c 100%);
  box-shadow: 0 4px 20px var(--strong-g);
  transition: transform .08s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.tap-btn:active { transform: scale(.96); }
.tap-btn.hit {
  background: linear-gradient(135deg, var(--hit) 0%, #15803d 100%) !important;
  box-shadow: 0 4px 24px var(--hit-g) !important;
}
.tap-btn.miss {
  background: linear-gradient(135deg, var(--miss) 0%, #991b1b 100%) !important;
  box-shadow: 0 4px 24px rgba(255,59,59,.4) !important;
}
.tap-score {
  display: flex; justify-content: center; gap: 20px;
  margin-top: 10px; font-size: .78rem; font-variant-numeric: tabular-nums;
}
.tap-score .hits { color: var(--hit); font-weight: 600; }
.tap-score .misses { color: var(--miss); font-weight: 600; }
.tap-score .pct { color: var(--fg-dim); }
.tap-feedback {
  font-size: .72rem; color: var(--fg-dim); margin-top: 4px;
  min-height: 18px;
}

/* Controls row */
.ctrl-row {
  display: flex; gap: 8px; justify-content: center;
  align-items: center; margin-top: 12px; flex-wrap: wrap;
}
.ctrl-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg); border-radius: 8px; padding: 7px 14px;
  font-family: var(--ff-b); font-size: .78rem; font-weight: 500;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.ctrl-btn:hover { border-color: var(--fg-muted); }
.ctrl-btn.active { border-color: var(--strong); color: var(--strong); }
.bpm-display {
  font-family: var(--ff-d); font-size: .82rem; font-weight: 600;
  color: var(--fg); min-width: 80px; text-align: center;
}
.diff-group {
  display: flex; gap: 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border);
}
.diff-btn {
  background: var(--surface); border: none; color: var(--fg-dim);
  padding: 7px 10px; font-family: var(--ff-b); font-size: .72rem;
  font-weight: 600; cursor: pointer; transition: all .15s;
  letter-spacing: .03em; border-right: 1px solid var(--border);
}
.diff-btn:last-child { border-right: none; }
.diff-btn:hover { color: var(--fg); }
.diff-btn.active { background: var(--strong); color: #fff; }
.diff-btn.active.med { background: var(--medium); }
.diff-btn.active.easy { background: var(--hit); }
.diff-label {
  font-size: .68rem; color: var(--fg-muted); letter-spacing: .04em;
}
.bpm-adj {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg); width: 30px; height: 30px; border-radius: 6px;
  font-size: 1rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}
.bpm-adj:hover { border-color: var(--fg-muted); }
.cal-status {
  font-size: .64rem; color: var(--hit); font-weight: 600;
  letter-spacing: .04em; opacity: 0; transition: opacity .3s;
  position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%); white-space: nowrap;
}
.bpm-wrap { position: relative; display: flex; align-items: center; gap: 4px; }
.ctrl-btn.busy { border-color: var(--strong); color: var(--strong); cursor: progress; }
.analyze-status {
  margin-top: 10px; font-family: var(--ff-b); font-size: .74rem;
  line-height: 1.45; color: var(--fg-dim); min-height: 1.1em;
}
.analyze-status.ok { color: var(--hit); }
.analyze-status.warn { color: var(--miss); }

/* Playlist (side column) */
.playlist-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.playlist-title {
  font-family: var(--ff-d); font-size: .82rem; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--fg-dim);
}
.playlist-count {
  font-size: .68rem; color: var(--fg-muted);
}
.song-list {
  display: flex; flex-direction: column; gap: 2px;
  max-height: 70vh; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.song-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background .15s;
  border: 1px solid transparent; flex-shrink: 0;
}
.song-item:hover { background: var(--surface); }
.song-item.active {
  background: var(--strong-g); border-color: var(--strong);
}
.song-num {
  font-family: var(--ff-d); font-size: .68rem; color: var(--fg-muted);
  width: 16px; text-align: right; flex-shrink: 0;
}
.song-info { flex: 1; min-width: 0; }
.song-name {
  font-size: .78rem; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-artist {
  font-size: .64rem; color: var(--fg-dim); margin-top: 1px;
}
.song-dur {
  font-size: .68rem; color: var(--fg-muted); font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div class="app">
  <h1>SALSA TIMING</h1>
  <div class="subtitle">On-1 Beat Trainer</div>

  <div class="layout">
    <div class="main-col">
      <div class="now-playing" id="nowPlaying"></div>

      <div class="yt-wrap">
        <div id="ytPlayer"></div>
        <div class="yt-placeholder" id="ytPlaceholder">Select a song to start</div>
      </div>

      <!-- Transport controls -->
      <div class="transport">
        <button class="transport-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </button>
        <button class="transport-btn play-btn" id="playPauseBtn" title="Play / Pause">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="transport-btn" id="stopBtn" title="Stop">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button class="transport-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="time-bar">
        <span id="timeElapsed">0:00</span>
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-fill" id="progressFill"></div>
          <div class="seek-thumb" id="seekThumb"></div>
        </div>
        <span id="timeDuration">0:00</span>
      </div>

      <div class="wave-wrap">
        <canvas id="waveform"></canvas>
      </div>

      <div class="beat-display">
        <div class="beat-num" id="beatNum">&ndash;</div>
        <div class="beat-label" id="beatLabel">waiting</div>
      </div>

      <div class="beat-strip" id="beatStrip">
        <div class="beat-pip b1" data-b="1">1</div>
        <div class="beat-pip step" data-b="2">2</div>
        <div class="beat-pip step" data-b="3">3</div>
        <div class="beat-pip pause" data-b="4">&middot;</div>
        <div class="beat-pip b5" data-b="5">5</div>
        <div class="beat-pip step" data-b="6">6</div>
        <div class="beat-pip step" data-b="7">7</div>
        <div class="beat-pip pause" data-b="8">&middot;</div>
      </div>

      <div class="tap-section">
        <div class="tap-title">Tap Step 1</div>
        <button class="tap-btn" id="tapBtn">TAP ON BEAT 1</button>
        <div class="tap-score">
          <span class="hits" id="tapHits">Hits: 0</span>
          <span class="misses" id="tapMisses">Misses: 0</span>
          <span class="pct" id="tapPct">0%</span>
        </div>
        <div class="tap-feedback" id="tapFeedback">Tap when you hear beat 1</div>
      </div>

      <div class="ctrl-row">
        <button class="ctrl-btn" id="metroToggle">Metronome</button>
        <div class="bpm-wrap">
          <button class="bpm-adj" id="bpmDown">&minus;</button>
          <div class="bpm-display" id="bpmDisplay">180 BPM</div>
          <button class="bpm-adj" id="bpmUp">+</button>
          <div class="cal-status" id="calStatus">saved</div>
        </div>
        <button class="ctrl-btn" id="calibrateBtn">Auto-Calibrate</button>
        <button class="ctrl-btn" id="analyzeBtn">Measure BPM</button>
        <button class="ctrl-btn" id="resyncBtn">Re-sync Beat 1</button>
        <button class="ctrl-btn" id="resetScore">Reset Score</button>
        <span class="diff-label">Difficulty:</span>
        <div class="diff-group" id="diffGroup">
          <button class="diff-btn" data-tol="0.30">Hard</button>
          <button class="diff-btn med active" data-tol="0.45">Medium</button>
          <button class="diff-btn easy" data-tol="0.55">Easy</button>
        </div>
      </div>
      <div class="analyze-status" id="analyzeStatus"></div>
    </div>

    <div class="side-col">
      <div class="playlist-header">
        <div class="playlist-title">Practice Songs</div>
        <div class="playlist-count" id="playlistCount">16 songs</div>
      </div>
      <div class="song-list" id="songList"></div>
    </div>
  </div>
</div>

<script>
/* beat1: seconds into the video where beat 1 first lands.
   Tap "TAP ON BEAT 1" while a song plays to re-sync if the offset is off. */
var SONGS = [
  { title: 'Salsa Timing Full Track With Count', artist: 'Salsa Timing', dur: '4:52', secs: 292, bpm: 180, ytId: 'nOY0nOQXnBA', beat1: 0.00 },
  { title: 'Salsa Clave / Piano / Brass / Congas Count', artist: 'Berna Jam', dur: '3:41', secs: 221, bpm: 176, ytId: '8yLE4Otjgmk', beat1: 0.00 },
  { title: 'The Best Salsa Song for Beginners', artist: 'Counting only on 1', dur: '4:15', secs: 255, bpm: 170, ytId: 'bbiiRkKfrSY', beat1: 0.00 },
  { title: 'Salsa Congas / Cowbells / Bongos / Bass Count', artist: 'Berna Jam', dur: '2:31', secs: 151, bpm: 176, ytId: 'XLGVBy2_7Fk', beat1: 0.00 },
  { title: 'Scuola Di Salsa', artist: 'Berna Jam', dur: '4:27', secs: 267, bpm: 178, ytId: 'JxxK8rjqwYU', beat1: 0.00 },
  { title: '1 Count', artist: 'Salsa Timing', dur: '4:12', secs: 252, bpm: 180, ytId: 'Eykym0djBeo', beat1: 0.00 },
  { title: 'Salsa Clave / Piano / Brass / Congas Uncount', artist: 'Berna Jam', dur: '3:41', secs: 221, bpm: 176, ytId: 'beKK7bzlJYY', beat1: 0.00 },
  { title: 'Salsa Timing Music 1 & 5 Count', artist: 'Salsa Timing', dur: '3:25', secs: 205, bpm: 180, ytId: 'eBxODRL5PpA', beat1: 0.00 },
  { title: 'Salsa Timing Find the Beat 1 Count', artist: 'Salsa Timing', dur: '4:06', secs: 246, bpm: 180, ytId: 'n88xDAei8sU', beat1: 0.00 },
  { title: 'Salsa Timing Find the Beat 1/5 Counts', artist: 'Salsa Timing', dur: '4:06', secs: 246, bpm: 180, ytId: 'LCs6bD7hg5Y', beat1: 0.00 },
  { title: 'Rumba Rumberos (Beginner with Counting on One)', artist: 'Peter Rolls', dur: '4:43', secs: 283, bpm: 168, ytId: 'Ya3d8d3vu2I', beat1: 0.00 },
  { title: 'with Counts 1 5', artist: 'Malek Abu', dur: '4:16', secs: 256, bpm: 175, ytId: 'Nm3z0rlo4xo', beat1: 0.00 },
  { title: 'Salsa Practice Beginners', artist: 'Dj Guero', dur: '5:00', secs: 300, bpm: 172, ytId: 'W4o1eVAwI8c', beat1: 0.00 },
  { title: 'Salsa Timing - Abre Que Voy (HD)', artist: 'Salsa Beat Machine', dur: '3:55', secs: 235, bpm: 185, ytId: 'DN_u2BVc9u0', beat1: 0.00 },
  { title: 'Singapore Vibes', artist: 'La Maxima 79', dur: '4:11', secs: 251, bpm: 192, ytId: 'l5qBmrW_fUk', beat1: 0.00 },
  { title: 'Uno dos tres, Cinco seis siete...', artist: 'Dj Jam', dur: '6:19', secs: 379, bpm: 178, ytId: 'F4yJa1g7Xnw', beat1: 0.00 },
];

/* ---- State ---- */
var bpm = 180, playing = false, activeSong = -1;
var beatDur, beat8 = 0, prevBeat8 = 0;
var metroOn = false, metroCtx = null, tolMul = 0.45;
var tapHits = 0, tapMisses = 0, tapTotal = 0;
var beatAligned = false, beat1PlayerTime = 0;
var player = null, ytReady = false, timeUpdateTimer = null;
var animFrame = null;
var lastBeat1TapTime = null;
var bpmFromAudio = false;

/* ---- Per-song calibration (localStorage) ---- */
function loadCalibration(ytId) {
  try {
    var d = localStorage.getItem('salsa-cal-' + ytId);
    return d ? JSON.parse(d) : null;
  } catch (e) { return null; }
}
function saveCalibration(ytId, savedBpm, savedBeat1, fromAudio) {
  try {
    localStorage.setItem('salsa-cal-' + ytId, JSON.stringify({
      bpm: savedBpm,
      beat1: (savedBeat1 === null || savedBeat1 === undefined) ? null : savedBeat1,
      fromAudio: !!fromAudio
    }));
    showCalSaved();
  } catch (e) {}
}
function showCalSaved() {
  var el = document.getElementById('calStatus');
  if (!el) return;
  el.textContent = 'saved';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.style.opacity = '0'; }, 1500);
}

/* bpm is kept fractional on purpose: rounding to a whole number costs about two
   beats of drift across a four-minute track. */
function fmtBpm(v) {
  return (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '');
}
function setBpm(v) {
  bpm = Math.min(240, Math.max(60, v));
  beatDur = 60 / bpm;
  document.getElementById('bpmDisplay').textContent = fmtBpm(bpm) + ' BPM';
}

/* ---- Noise table for simulated waveform ---- */
var NOISE_LEN = 512, noiseTable = new Float32Array(NOISE_LEN);
(function () { for (var i = 0; i < NOISE_LEN; i++) noiseTable[i] = Math.random(); })();

/* ---- YouTube IFrame API ---- */
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
var first = document.getElementsByTagName('script')[0];
first.parentNode.insertBefore(tag, first);

function onYouTubeIframeAPIReady() { ytReady = true; }

function createPlayer(videoId) {
  if (player) { player.destroy(); player = null; }
  document.getElementById('ytPlaceholder').style.display = 'none';
  player = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: function (e) { e.target.playVideo(); },
      onStateChange: onPlayerStateChange
    }
  });
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    playing = true;
    if (!beatAligned && activeSong >= 0) {
      var cal = loadCalibration(SONGS[activeSong].ytId);
      var hasPhase = cal && cal.beat1 !== null && cal.beat1 !== undefined;
      if (hasPhase) {
        setBpm(cal.bpm);
        bpmFromAudio = !!cal.fromAudio;
        beat1PlayerTime = cal.beat1;
      } else if (!cal) {
        beat1PlayerTime = SONGS[activeSong].beat1 || 0;
      }
      /* A calibration that carries a measured bpm but no phase yet stays
         unaligned, so the counter waits for a tap instead of guessing. */
      if (hasPhase || !cal) {
        beatAligned = true;
        beat8 = 1; prevBeat8 = 1;
      }
    }
    updatePlayPauseIcon();
    startTimeUpdates();
    startBeatLoop();
  } else if (e.data === YT.PlayerState.PAUSED) {
    playing = false;
    updatePlayPauseIcon();
    stopTimeUpdates();
  } else if (e.data === YT.PlayerState.ENDED) {
    playing = false;
    updatePlayPauseIcon();
    stopTimeUpdates();
    playNext();
  }
}

function updatePlayPauseIcon() {
  var icon = document.getElementById('playIcon');
  if (playing) {
    icon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  } else {
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function startTimeUpdates() {
  stopTimeUpdates();
  timeUpdateTimer = setInterval(updateTimeBar, 250);
}
function stopTimeUpdates() {
  if (timeUpdateTimer) { clearInterval(timeUpdateTimer); timeUpdateTimer = null; }
}

function updateTimeBar() {
  if (!player || !player.getCurrentTime) return;
  var cur = player.getCurrentTime() || 0;
  var dur = player.getDuration() || (activeSong >= 0 ? SONGS[activeSong].secs : 0);
  document.getElementById('timeElapsed').textContent = fmtTime(cur);
  document.getElementById('timeDuration').textContent = fmtTime(dur);
  var pct = dur > 0 ? (cur / dur) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('seekThumb').style.left = pct + '%';
}

function fmtTime(s) {
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}

/* ---- Progress bar seek (click + drag) ---- */
(function () {
  var wrap = document.getElementById('progressWrap');
  var fill = document.getElementById('progressFill');
  var thumb = document.getElementById('seekThumb');
  var dragging = false;

  function seekTo(clientX) {
    if (!player || !player.getDuration) return;
    var rect = wrap.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    fill.style.transition = 'none';
    fill.style.width = (pct * 100) + '%';
    thumb.style.left = (pct * 100) + '%';
    player.seekTo(pct * player.getDuration(), true);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    seekTo(x);
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    wrap.classList.remove('dragging');
    fill.style.transition = '';
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }

  wrap.addEventListener('mousedown', function (e) {
    dragging = true;
    wrap.classList.add('dragging');
    seekTo(e.clientX);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  wrap.addEventListener('touchstart', function (e) {
    dragging = true;
    wrap.classList.add('dragging');
    seekTo(e.touches[0].clientX);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }, { passive: true });
})();

/* ---- Transport controls ---- */
document.getElementById('playPauseBtn').addEventListener('click', function () {
  if (!player || !player.getPlayerState) {
    if (activeSong < 0) playSong(0);
    return;
  }
  var state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
});

document.getElementById('stopBtn').addEventListener('click', function () {
  if (!player || !player.stopVideo) return;
  player.stopVideo();
  playing = false;
  updatePlayPauseIcon();
  stopTimeUpdates();
  document.getElementById('progressFill').style.width = '0';
  document.getElementById('seekThumb').style.left = '0';
  document.getElementById('timeElapsed').textContent = '0:00';
});

document.getElementById('prevBtn').addEventListener('click', function () {
  if (activeSong <= 0) return;
  playSong(activeSong - 1);
});

document.getElementById('nextBtn').addEventListener('click', function () {
  playNext();
});

/* ---- Play song ---- */
function playSong(idx) {
  var song = SONGS[idx];
  if (!song || !song.ytId) return;
  activeSong = idx;
  lastBeat1TapTime = null;

  var cal = loadCalibration(song.ytId);
  var startBpm;
  if (cal) {
    startBpm = cal.bpm;
    bpmFromAudio = !!cal.fromAudio;
    if (cal.beat1 === null || cal.beat1 === undefined) {
      beatAligned = false;
    } else {
      beat1PlayerTime = cal.beat1;
      beatAligned = true;
      beat8 = 1; prevBeat8 = 1;
    }
  } else {
    startBpm = song.bpm;
    bpmFromAudio = false;
    beatAligned = false;
  }
  setBpm(startBpm);
  var np = document.getElementById('nowPlaying');
  np.textContent = song.title + ' — ' + song.artist;
  np.classList.add('visible');
  renderPlaylist();
  resetTapScore();

  if (ytReady) { createPlayer(song.ytId); }
  else {
    var check = setInterval(function () {
      if (ytReady) { clearInterval(check); createPlayer(song.ytId); }
    }, 200);
  }
}

function playNext() {
  if (activeSong < 0) return;
  var next = activeSong + 1;
  if (next >= SONGS.length) next = 0;
  playSong(next);
}

/* ---- Beat engine (synced to YouTube player time) ---- */
function startBeatLoop() {
  beatDur = 60 / bpm;
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(beatFrame);
}

function getPlayerTime() {
  if (player && player.getCurrentTime) return player.getCurrentTime();
  return 0;
}

function beatFrame() {
  if (!playing) { animFrame = null; return; }
  if (beatAligned) {
    var pt = getPlayerTime();
    var elapsed = pt - beat1PlayerTime;
    var beatPos = elapsed / beatDur;
    var newBeat8 = ((Math.floor(beatPos) % 8) + 8) % 8 + 1;
    if (newBeat8 !== prevBeat8) {
      beat8 = newBeat8;
      prevBeat8 = beat8;
      updateBeatDisplay(beat8);
    }
  }
  renderWaveform();
  animFrame = requestAnimationFrame(beatFrame);
}

function updateBeatDisplay(b) {
  var labels = ['', 'STRONG', 'step', 'step', 'pause', 'ACCENT', 'step', 'step', 'pause'];
  var colors = ['', 'var(--strong)', 'var(--regular)', 'var(--regular)', 'var(--fg-muted)',
                'var(--medium)', 'var(--regular)', 'var(--regular)', 'var(--fg-muted)'];
  var numEl = document.getElementById('beatNum');
  if (!beatAligned) {
    numEl.textContent = '?';
    numEl.style.color = 'var(--fg-muted)';
    document.getElementById('beatLabel').textContent = 'tap beat 1 to sync';
    document.querySelectorAll('.beat-pip').forEach(function (p) { p.classList.remove('active'); });
    return;
  }
  numEl.textContent = (b === 4 || b === 8) ? '·' : b;
  numEl.style.color = colors[b];
  document.getElementById('beatLabel').textContent = labels[b];
  var pips = document.querySelectorAll('.beat-pip');
  pips.forEach(function (p, i) { p.classList.toggle('active', i === b - 1); });
  if (metroOn) playMetroClick(b);
}

/* ---- Waveform (bright, high-contrast) ---- */
var waveColors = { strong: null, medium: null, regular: null, pause: null };

function resolveWaveColors() {
  var el = document.documentElement;
  var cs = getComputedStyle(el);
  waveColors.strong = cs.getPropertyValue('--wave-strong').trim() || '#ff4d4d';
  waveColors.medium = cs.getPropertyValue('--wave-medium').trim() || '#ffc233';
  waveColors.regular = cs.getPropertyValue('--wave-regular').trim() || '#a78bfa';
  waveColors.pause   = cs.getPropertyValue('--wave-pause').trim()   || '#555';
}
resolveWaveColors();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resolveWaveColors);

function renderWaveform() {
  var c = document.getElementById('waveform');
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) {
    c.width = w * dpr; c.height = h * dpr;
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var bars = 80, bw = w / bars, gap = 1.5;
  var now = performance.now() / 1000;
  var fullPhase, cb;
  if (beatAligned) {
    var pt = getPlayerTime();
    var elapsed = pt - beat1PlayerTime;
    var beatPos = elapsed / beatDur;
    fullPhase = ((beatPos % 8) + 8) % 8;
    cb = Math.floor(fullPhase) + 1;
  } else {
    fullPhase = ((now * (bpm / 60)) % 8);
    cb = 0;
  }

  var color;
  if (!beatAligned) color = waveColors.pause;
  else if (cb === 1) color = waveColors.strong;
  else if (cb === 5) color = waveColors.medium;
  else if (cb === 4 || cb === 8) color = waveColors.pause;
  else color = waveColors.regular;

  for (var i = 0; i < bars; i++) {
    var ni = (i * 7 + Math.floor(now * 4)) % NOISE_LEN;
    var noise = noiseTable[ni];
    var beatInten = getBeatIntensity(fullPhase, i / bars);
    var hNorm = (.12 + noise * .3) * beatInten;
    var barH = Math.max(3, hNorm * h);

    var alpha = .4 + beatInten * .6;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    var x = i * bw + gap / 2;
    var bw2 = bw - gap;
    ctx.beginPath();
    ctx.roundRect(x, h - barH, bw2, barH, [2, 2, 0, 0]);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function getBeatIntensity(fullPhase, barPos) {
  var cb = Math.floor(fullPhase) + 1;
  var frac = fullPhase - Math.floor(fullPhase);
  var decay = Math.max(0, 1 - frac * 1.8);
  var base;
  if (cb === 1) base = 1.0;
  else if (cb === 5) base = .85;
  else if (cb === 2 || cb === 3 || cb === 6 || cb === 7) base = .6;
  else base = .12;
  var center = .3 + Math.sin(fullPhase * .8) * .2;
  var spread = Math.exp(-Math.pow((barPos - center) * 3, 2));
  return (.2 + base * decay * (.3 + spread * .7));
}

/* ---- Metronome ---- */
function playMetroClick(b) {
  if (!metroCtx) metroCtx = new (window.AudioContext || window.webkitAudioContext)();
  var osc = metroCtx.createOscillator();
  var gain = metroCtx.createGain();
  osc.connect(gain); gain.connect(metroCtx.destination);
  osc.frequency.value = (b === 1) ? 1200 : (b === 5) ? 900 : 660;
  gain.gain.value = (b === 4 || b === 8) ? 0 : (b === 1) ? .35 : .18;
  var t = metroCtx.currentTime;
  osc.start(t);
  gain.gain.exponentialRampToValueAtTime(.001, t + .06);
  osc.stop(t + .07);
}

/* ---- Tap scoring ---- */
var tapBtn = document.getElementById('tapBtn');
tapBtn.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (!playing) return;
  var pt = getPlayerTime();

  if (!beatAligned) {
    beatAligned = true;
    beat1PlayerTime = pt;
    beat8 = 1; prevBeat8 = 1;
    lastBeat1TapTime = pt;
    updateBeatDisplay(1);
    if (activeSong >= 0) saveCalibration(SONGS[activeSong].ytId, bpm, beat1PlayerTime, bpmFromAudio);
    showTapFeedback(bpmFromAudio
      ? 'Beat 1 synced to the measured ' + fmtBpm(bpm) + ' BPM'
      : 'Beat 1 synced! Tap again on next 1 to lock BPM', true);
    flashBtn(true);
    return;
  }

  var cycleDur = 8 * beatDur;
  var elapsed = pt - beat1PlayerTime;
  var posInCycle = ((elapsed % cycleDur) + cycleDur) % cycleDur;
  var tolerance = beatDur * tolMul;

  var hit = posInCycle < tolerance || posInCycle > (cycleDur - tolerance);
  tapTotal++;
  if (hit) {
    tapHits++;
    flashBtn(true);
    /* A measured bpm is more precise than anything tapping can resolve, so taps
       only derive bpm when the song has not been analysed. */
    if (lastBeat1TapTime !== null && !bpmFromAudio) {
      var interval = pt - lastBeat1TapTime;
      if (interval > 1.0 && interval < 12.0) {
        var nCycles = Math.round(interval / cycleDur);
        if (nCycles >= 1) {
          var detectedBpm = Math.round(60 * 8 * nCycles / interval);
          if (detectedBpm >= 60 && detectedBpm <= 240 && Math.abs(detectedBpm - bpm) > 1) {
            setBpm(detectedBpm);
            beat1PlayerTime = pt;
            beat8 = 1; prevBeat8 = 1;
            if (activeSong >= 0) saveCalibration(SONGS[activeSong].ytId, bpm, beat1PlayerTime, false);
            showTapFeedback('BPM locked: ' + fmtBpm(bpm) + '!', true);
            lastBeat1TapTime = pt;
            updateTapDisplay();
            return;
          }
        }
      }
    }
    lastBeat1TapTime = pt;
    showTapFeedback(getTapMsg(true, posInCycle, cycleDur), true);
  } else {
    tapMisses++;
    flashBtn(false);
    showTapFeedback(getTapMsg(false, posInCycle, cycleDur), false);
  }
  updateTapDisplay();
});

function flashBtn(isHit) {
  tapBtn.classList.remove('hit', 'miss');
  void tapBtn.offsetWidth;
  tapBtn.classList.add(isHit ? 'hit' : 'miss');
  setTimeout(function () { tapBtn.classList.remove('hit', 'miss'); }, 250);
}

function getTapMsg(hit, pos, cyc) {
  if (hit) return ['Perfect!', 'Right on!', 'Nailed it!', 'Got it!', 'On the beat!'][Math.floor(Math.random() * 5)];
  var off = pos < cyc / 2 ? pos : pos - cyc;
  return (off > 0 ? 'Late' : 'Early') + ' by ' + Math.round(Math.abs(off) * 1000) + 'ms';
}

function showTapFeedback(msg, isHit) {
  var el = document.getElementById('tapFeedback');
  el.textContent = msg;
  el.style.color = isHit ? 'var(--hit)' : 'var(--miss)';
}

function updateTapDisplay() {
  document.getElementById('tapHits').textContent = 'Hits: ' + tapHits;
  document.getElementById('tapMisses').textContent = 'Misses: ' + tapMisses;
  document.getElementById('tapPct').textContent = (tapTotal > 0 ? Math.round(tapHits / tapTotal * 100) : 0) + '%';
}

function resetTapScore() {
  tapHits = 0; tapMisses = 0; tapTotal = 0;
  updateTapDisplay();
  var fb = document.getElementById('tapFeedback');
  var hasCal = activeSong >= 0 && loadCalibration(SONGS[activeSong].ytId);
  fb.textContent = hasCal ? 'Calibrated — tap on 1 to practice' : 'Tap on beat 1 — first tap syncs, second locks BPM';
  fb.style.color = 'var(--fg-dim)';
}

document.getElementById('metroToggle').addEventListener('click', function () {

  this.classList.toggle('active', metroOn);
});
document.getElementById('bpmDown').addEventListener('click', function () {

});
document.getElementById('resetScore').addEventListener('click', resetTapScore);
document.getElementById('resyncBtn').addEventListener('click', function () {
  beatAligned = false;
  beat8 = 0; prevBeat8 = 0;
  lastBeat1TapTime = null;
  updateBeatDisplay(0);
  showTapFeedback('Tap the TAP button on beat 1 to re-sync', false);
});

document.getElementById('diffGroup').addEventListener('click', function (e) {
  var btn = e.target.closest('.diff-btn');
  if (!btn) return;
  this.querySelectorAll('.diff-btn').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  tolMul = parseFloat(btn.dataset.tol);
});

/* ---- Audio tempo analysis ----
   Captures this tab's own audio (a digital copy of the YouTube stream, not a
   microphone recording) and measures the quarter-note tempo: spectral-flux
   onset envelope, autocorrelation for candidates, then a coarse-to-fine comb
   fit. Phase is deliberately NOT taken from the capture: captured audio lags
   player time by an unknown amount of buffering, which would be a large
   fraction of a beat, so beat 1 still comes from a tap. */
var ANALYZE_SECS = 45;
var BPM_MIN = 130, BPM_MAX = 250;
var analyzing = false;

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function setAnalyzeStatus(msg, cls) {
  var el = document.getElementById('analyzeStatus');
  if (!el) return;
  el.textContent = msg;
  el.className = 'analyze-status' + (cls ? ' ' + cls : '');
}

function hannWindow(n) {
  var w = new Float64Array(n);
  for (var i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / n);
  return w;
}

/* in-place iterative radix-2 FFT */
function fft(re, im) {
  var n = re.length, i, j, bit, len, k, t, half;
  for (i = 1, j = 0; i < n; i++) {
    for (bit = n >> 1; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (len = 2; len <= n; len <<= 1) {
    half = len >> 1;
    var ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (i = 0; i < n; i += len) {
      var cr = 1, ci = 0;
      for (k = 0; k < half; k++) {
        var ar = re[i + k], ai = im[i + k];
        var br = re[i + k + half], bi = im[i + k + half];
        var vr = br * cr - bi * ci, vi = br * ci + bi * cr;
        re[i + k] = ar + vr; im[i + k] = ai + vi;
        re[i + k + half] = ar - vr; im[i + k + half] = ai - vi;
        var ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

/* t0 is the time of frame 0: flux[i] measures the rise between two frame
   centres, so it belongs at their midpoint, not at the frame's left edge.
   Getting this wrong biases every phase estimate by about 25ms. */
function onsetEnvelope(x, sr, hop, nfft, fmin, fmax) {
  var win = hannWindow(nfft), nb = (nfft >> 1) + 1;
  var lo = 0, hi = nb - 1;
  if (fmin !== undefined) {
    lo = Math.max(0, Math.floor(fmin * nfft / sr));
    hi = Math.min(nb - 1, Math.ceil(fmax * nfft / sr));
  }
  var nFrames = 1 + Math.max(0, Math.floor((x.length - nfft) / hop));
  var env = new Float64Array(nFrames);
  var re = new Float64Array(nfft), im = new Float64Array(nfft);
  var prev = new Float64Array(nb), cur = new Float64Array(nb);
  var f, i, off, sum, d, swap;
  for (f = 0; f < nFrames; f++) {
    off = f * hop;
    for (i = 0; i < nfft; i++) { re[i] = x[off + i] * win[i]; im[i] = 0; }
    fft(re, im);
    for (i = lo; i <= hi; i++) {
      cur[i] = Math.log1p(10 * Math.sqrt(re[i] * re[i] + im[i] * im[i]));
    }
    if (f > 0) {
      sum = 0;
      for (i = lo; i <= hi; i++) { d = cur[i] - prev[i]; if (d > 0) sum += d; }
      env[f] = sum;
    }
    swap = prev; prev = cur; cur = swap;
  }
  var mean = 0;
  for (f = 0; f < nFrames; f++) mean += env[f];
  mean /= Math.max(1, nFrames);
  for (f = 0; f < nFrames; f++) env[f] -= mean;
  return { env: env, fps: sr / hop, t0: (nfft - hop) / (2 * sr) };
}

function sampleEnv(env, frame) {
  var n = env.length;
  if (!(frame >= 0)) frame = 0;
  var i0 = Math.floor(frame);
  if (i0 > n - 2) i0 = n - 2;
  if (i0 < 0) return 0;
  var fr = frame - i0;
  return env[i0] * (1 - fr) + env[i0 + 1] * fr;
}

/* autocorrelation peaks, parabolically interpolated for sub-frame lag */
function tempoCandidates(env, fps, top) {
  var loLag = Math.max(2, Math.floor(fps * 60 / BPM_MAX));
  var hiLag = Math.ceil(fps * 60 / 65);
  var n = env.length;
  if (hiLag >= n - 2) hiLag = n - 3;
  if (hiLag <= loLag) return [];
  var ac = new Float64Array(hiLag + 2), lag, i, s;
  for (lag = loLag; lag <= hiLag; lag++) {
    s = 0;
    for (i = 0; i + lag < n; i++) s += env[i] * env[i + lag];
    ac[lag] = s / (n - lag);
  }
  var peaks = [];
  for (lag = loLag + 1; lag < hiLag; lag++) {
    if (ac[lag] > ac[lag - 1] && ac[lag] >= ac[lag + 1]) {
      var den = ac[lag - 1] - 2 * ac[lag] + ac[lag + 1];
      var dl = den === 0 ? 0 : 0.5 * (ac[lag - 1] - ac[lag + 1]) / den;
      if (dl > 0.5) dl = 0.5;
      if (dl < -0.5) dl = -0.5;
      peaks.push({ v: ac[lag], bpm: fps * 60 / (lag + dl) });
    }
  }
  peaks.sort(function (a, b) { return b.v - a.v; });
  var out = [];
  for (var p = 0; p < peaks.length && out.length < top; p++) {
    var dup = false;
    for (var q = 0; q < out.length; q++) {
      if (Math.abs(peaks[p].bpm - out[q]) < 1) { dup = true; break; }
    }
    if (!dup) out.push(peaks[p].bpm);
  }
  return out;
}

/* mean onset energy on the beat grid, maximised over bpm and phase */
function combFit(env, fps, center, span, step, nPhase, nLimit) {
  var n = nLimit || env.length, best = null;
  for (var b = center - span; b <= center + span + 1e-9; b += step) {
    if (b < 120 || b > 260) continue;
    var T = fps * 60 / b;
    var nBeats = Math.floor((n - 2) / T);
    if (nBeats < 12) continue;
    for (var p = 0; p < nPhase; p++) {
      var ph = T * p / nPhase, sum = 0;
      for (var k = 0; k < nBeats; k++) {
        var t = ph + T * k, i0 = Math.floor(t);
        if (i0 < 0) i0 = 0;
        if (i0 > n - 2) i0 = n - 2;
        var fr = t - i0;
        sum += env[i0] * (1 - fr) + env[i0 + 1] * fr;
      }
      sum /= nBeats;
      if (!best || sum > best.score) {
        best = { score: sum, bpm: b, phase: ph, nBeats: nBeats };
      }
    }
  }
  return best;
}

function measureTempo(x, sr) {
  /* ~11ms hop, ~43ms window, matching the offline pipeline this was ported from */
  var hop = Math.max(128, Math.round(sr / 93.75));
  var nfft = sr < 32000 ? 1024 : 2048;
  if (x.length < nfft * 20) return null;

  var o = onsetEnvelope(x, sr, hop, nfft);
  var env = o.env, fps = o.fps;
  var cands = tempoCandidates(env, fps, 8);
  if (!cands.length) return null;

  /* coarse pass: autocorrelation lags are quantised, so search a wide span */
  var mults = [1, 2, 0.5], coarse = [], i, m, b, f;
  for (i = 0; i < cands.length; i++) {
    for (m = 0; m < mults.length; m++) {
      b = cands[i] * mults[m];
      if (b < BPM_MIN || b > BPM_MAX) continue;
      f = combFit(env, fps, b, 5, 0.2, 96);
      if (f) coarse.push(f);
    }
  }
  if (!coarse.length) return null;
  coarse.sort(function (a, c) { return c.score - a.score; });

  /* fine pass: phase error accumulates over the window, so bpm needs ~0.01 */
  var fine = [], seen = [];
  for (i = 0; i < coarse.length && seen.length < 4; i++) {
    var dup = false;
    for (var q = 0; q < seen.length; q++) {
      if (Math.abs(coarse[i].bpm - seen[q]) < 0.4) { dup = true; break; }
    }
    if (dup) continue;
    seen.push(coarse[i].bpm);
    f = combFit(env, fps, coarse[i].bpm, 0.5, 0.005, 240);
    if (f) fine.push(f);
  }
  if (!fine.length) return null;
  fine.sort(function (a, c) { return c.score - a.score; });

  var half = Math.floor(env.length / 2);
  var h1 = combFit(env.subarray(0, half), fps, fine[0].bpm, 1.2, 0.02, 120);
  var h2 = combFit(env.subarray(half), fps, fine[0].bpm, 1.2, 0.02, 120);
  return {
    bpm: fine[0].bpm,
    margin: fine.length > 1 ? fine[0].score / fine[1].score : null,
    runnerUp: fine.length > 1 ? fine[1].bpm : null,
    spread: (h1 && h2) ? Math.abs(h1.bpm - h2.bpm) : null
  };
}

/* Locate the beat grid's phase at high resolution, +/- half a beat. */
function refinePhase(oh, bpmVal, phaseSec) {
  var T = 60 / bpmVal, dur = oh.env.length / oh.fps;
  var best = null, p, k, sum, nBeats;
  for (p = phaseSec - 0.5 * T; p <= phaseSec + 0.5 * T; p += 0.0005) {
    if (p < 0) continue;
    nBeats = Math.floor((dur - p) / T);
    if (nBeats < 12) continue;
    sum = 0;
    for (k = 0; k < nBeats; k++) {
      sum += sampleEnv(oh.env, (p + k * T - oh.t0) * oh.fps);
    }
    sum /= nBeats;
    if (!best || sum > best.s) best = { s: sum, p: p };
  }
  return best ? best.p : phaseSec;
}

/* Which of the eight beats carries the spoken "one". These are counting
   tracks, so the voice band is the giveaway. A track counting on both 1 and 5
   is genuinely ambiguous and shows up as low contrast. */
function pickEightPhase(ov, bpmVal, phaseSec, dur) {
  var T = 60 / bpmVal;
  var nBeats = Math.floor((dur - phaseSec - 0.2) / T);
  var scores = [], phi, k, d, s, n, t;
  for (phi = 0; phi < 8; phi++) {
    s = 0; n = 0;
    for (k = phi; k < nBeats; k += 8) {
      t = phaseSec + k * T;
      for (d = 0; d < 4; d++) { s += sampleEnv(ov.env, (t + d * 0.04 - ov.t0) * ov.fps); n++; }
    }
    scores.push(n ? s / n : 0);
  }
  var max = -Infinity, mean = 0, idx = 0;
  for (phi = 0; phi < 8; phi++) {
    mean += scores[phi];
    if (scores[phi] > max) { max = scores[phi]; idx = phi; }
  }
  mean /= 8;
  return { phi: idx, contrast: max / (Math.abs(mean) || 1e-12), scores: scores };
}

function measureBeat1(x, sr, bpmVal) {
  var hop = Math.max(128, Math.round(sr / 93.75));
  var nfft = sr < 32000 ? 1024 : 2048;
  var o = onsetEnvelope(x, sr, hop, nfft);
  /* bpm is already known, so this only searches phase */
  var fit = combFit(o.env, o.fps, bpmVal, 0.001, 0.001, 480);
  if (!fit) return null;
  var phaseSec = fit.phase / o.fps + o.t0;

  var hopHi = Math.max(32, Math.round(sr / 375));
  var oh = onsetEnvelope(x, sr, hopHi, 512);
  phaseSec = refinePhase(oh, bpmVal, phaseSec);

  var ov = onsetEnvelope(x, sr, hopHi, 1024, 300, 3000);
  var e = pickEightPhase(ov, bpmVal, phaseSec, x.length / sr);
  return {
    beat1: phaseSec + e.phi * (60 / bpmVal),
    contrast: e.contrast,
    gridPhase: phaseSec
  };
}

/* The capture starts while the video is paused, so it opens with true digital
   silence. The first sustained audio is therefore video time zero, which pins
   the phase without having to know the capture pipeline's latency. */
function findAudioStart(x, sr) {
  /* Block RMS, not raw samples: any waveform crosses zero constantly, so a run
     of consecutive samples over a threshold finds the first loud transient
     rather than the moment sound begins. */
  var block = Math.max(32, Math.floor(sr * 0.002));
  var nBlocks = Math.floor(x.length / block);
  if (nBlocks < 20) return -1;
  var probe = Math.min(nBlocks, Math.floor(0.30 * sr / block));
  var i, j, s, r, floorRms = 0;
  for (i = 0; i < probe; i++) {
    s = 0;
    for (j = 0; j < block; j++) { r = x[i * block + j]; s += r * r; }
    r = Math.sqrt(s / block);
    if (r > floorRms) floorRms = r;
  }
  var thresh = Math.max(floorRms * 4, 2e-5);
  for (i = probe; i < nBlocks; i++) {
    s = 0;
    for (j = 0; j < block; j++) { r = x[i * block + j]; s += r * r; }
    if (Math.sqrt(s / block) > thresh) return i * block;
  }
  return -1;
}

async function analyzeAudio() {
  if (analyzing) return;
  if (activeSong < 0 || !playing) {
    setAnalyzeStatus('Start a song playing first, then analyse it.', 'warn');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) {
    setAnalyzeStatus('This browser cannot capture tab audio. Desktop Chrome or Edge is needed.', 'warn');
    return;
  }

  var btn = document.getElementById('analyzeBtn');
  var stream = null, audioCtx = null, songId = SONGS[activeSong].ytId;
  analyzing = true;
  btn.classList.add('busy');
  try {
    setAnalyzeStatus('In the prompt: pick this tab and turn on "Also share tab audio".');
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    var aTracks = stream.getAudioTracks();
    stream.getVideoTracks().forEach(function (t) { t.stop(); });
    if (!aTracks.length) {
      setAnalyzeStatus('No audio was shared. Run it again and switch on "Also share tab audio".', 'warn');
      return;
    }

    var rec = new MediaRecorder(new MediaStream([aTracks[0]]));
    var parts = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) parts.push(e.data); };
    var stopped = new Promise(function (res) { rec.onstop = res; });
    rec.start();
    for (var s = ANALYZE_SECS; s > 0; s--) {
      setAnalyzeStatus('Listening to the track… ' + s + 's left (leave it playing).');
      await sleep(1000);
      if (!playing) {
        rec.stop();
        await stopped;
        setAnalyzeStatus('Playback stopped, so the capture was too short. Try again.', 'warn');
        return;
      }
    }
    rec.stop();
    await stopped;

    setAnalyzeStatus('Analysing the capture…');
    await sleep(40);
    var bytes = await new Blob(parts).arrayBuffer();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var decoded = await audioCtx.decodeAudioData(bytes);
    var result = measureTempo(decoded.getChannelData(0), decoded.sampleRate);

    if (!result) {
      setAnalyzeStatus('No steady pulse found. Try again over a busier stretch of the track.', 'warn');
      return;
    }
    if (songId !== (SONGS[activeSong] || {}).ytId) {
      setAnalyzeStatus('Song changed during the capture, so the result was discarded.', 'warn');
      return;
    }

    setBpm(result.bpm);
    bpmFromAudio = true;
    saveCalibration(songId, bpm, beatAligned ? beat1PlayerTime : null, true);
    renderPlaylist();

    var conf = (result.margin === null || result.margin > 1.5) ? 'high'
      : (result.margin > 1.15 ? 'fair' : 'low');
    var msg = 'Measured ' + fmtBpm(result.bpm) + ' BPM (confidence ' + conf + ').';
    if (conf !== 'high' && result.runnerUp) {
      msg += ' Next best was ' + fmtBpm(result.runnerUp) + ' BPM.';
    }
    if (result.spread !== null && result.spread > 1.5) {
      msg += ' The tempo drifts by about ' + result.spread.toFixed(1)
        + ' BPM across the capture, so this is an average and the count will';
      msg += ' slowly slide on a long track.';
    }
    msg += beatAligned
      ? ' Your existing beat 1 is kept.'
      : ' Now tap TAP ON BEAT 1 once to lock the count.';
    setAnalyzeStatus(msg, 'ok');
  } catch (err) {
    var name = err && err.name;
    if (name === 'NotAllowedError' || name === 'AbortError') {
      setAnalyzeStatus('Screen share was dismissed, so nothing was measured.');
    } else {
      setAnalyzeStatus('Analysis failed: ' + ((err && err.message) || name || 'unknown error'), 'warn');
    }
  } finally {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
    analyzing = false;
    btn.classList.remove('busy');
  }
}

/* Full calibration: rewind, open the capture on silence so video time zero is
   pinned, then play. Yields both bpm and beat 1 with nothing to tap. */
var CALIBRATE_SECS = 60;

async function autoCalibrate() {
  if (analyzing) return;
  if (activeSong < 0 || !player) {
    setAnalyzeStatus('Pick a song first, then auto-calibrate.', 'warn');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) {
    setAnalyzeStatus('This browser cannot capture tab audio. Desktop Chrome or Edge is needed.', 'warn');
    return;
  }

  var btn = document.getElementById('calibrateBtn');
  var stream = null, audioCtx = null, songId = SONGS[activeSong].ytId;
  analyzing = true;
  btn.classList.add('busy');
  try {
    setAnalyzeStatus('In the prompt: pick this tab and turn on "Also share tab audio".');
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    var aTracks = stream.getAudioTracks();
    stream.getVideoTracks().forEach(function (t) { t.stop(); });
    if (!aTracks.length) {
      setAnalyzeStatus('No audio was shared. Run it again and switch on "Also share tab audio".', 'warn');
      return;
    }

    setAnalyzeStatus('Rewinding to the start…');
    try { player.pauseVideo(); } catch (e) {}
    await sleep(300);
    try { player.seekTo(0, true); } catch (e) {}
    await sleep(700);
    try { player.pauseVideo(); } catch (e) {}
    await sleep(500);

    var rec = new MediaRecorder(new MediaStream([aTracks[0]]));
    var parts = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) parts.push(e.data); };
    var stopped = new Promise(function (res) { rec.onstop = res; });
    rec.start();
    var recWall = Date.now();
    await sleep(900);
    try { player.playVideo(); } catch (e) {}
    var playWall = Date.now();

    for (var s = CALIBRATE_SECS; s > 0; s--) {
      setAnalyzeStatus('Listening from the top… ' + s + 's left (leave it playing).');
      await sleep(1000);
    }
    var endTime = 0;
    try { endTime = player.getCurrentTime(); } catch (e) {}
    rec.stop();
    await stopped;
    aTracks.forEach(function (t) { t.stop(); });

    /* If an ad or a stall interrupted, video time will not have advanced by
       roughly the capture length and the silence anchor no longer means t=0. */
    if (Math.abs(endTime - CALIBRATE_SECS) > 6) {
      setAnalyzeStatus('Playback did not run cleanly from the start (an ad or buffering got in the way). Try again.', 'warn');
      return;
    }

    setAnalyzeStatus('Analysing…');
    await sleep(40);
    var bytes = await new Blob(parts).arrayBuffer();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var decoded = await audioCtx.decodeAudioData(bytes);
    var all = decoded.getChannelData(0), sr = decoded.sampleRate;

    var startIdx = findAudioStart(all, sr);
    if (startIdx < 0) {
      setAnalyzeStatus('Nothing audible was captured. Check that tab audio was shared, then retry.', 'warn');
      return;
    }
    /* Sound should begin about when playback was asked for, plus the capture
       pipeline's own lag. A much later onset means the track itself opens with
       silence, so the anchor is not video time zero and the phase cannot be
       trusted -- fall back to a tap rather than being a second out. */
    var impliedLag = (startIdx / sr) - (playWall - recWall) / 1000;
    var phaseTrusted = impliedLag < 0.6 && impliedLag > -0.25;

    var x = all.slice(startIdx);
    var tempo = measureTempo(x, sr);
    if (!tempo) {
      setAnalyzeStatus('No steady pulse found in the first minute. Try Measure BPM further into the track.', 'warn');
      return;
    }
    var phase = measureBeat1(x, sr, tempo.bpm);
    if (songId !== (SONGS[activeSong] || {}).ytId) {
      setAnalyzeStatus('Song changed during the capture, so the result was discarded.', 'warn');
      return;
    }

    setBpm(tempo.bpm);
    bpmFromAudio = true;
    var msg;
    if (phase && phaseTrusted) {
      beat1PlayerTime = phase.beat1;
      beatAligned = true;
      beat8 = 1; prevBeat8 = 1;
      saveCalibration(songId, bpm, beat1PlayerTime, true);
      msg = 'Calibrated: ' + fmtBpm(bpm) + ' BPM, beat 1 at ' + beat1PlayerTime.toFixed(2) + 's.';
      if (phase.contrast < 1.15) {
        msg += ' This track counts on both 1 and 5, so beat 1 is less certain — if it feels half a bar out, tap once on beat 1.';
      }
    } else {
      saveCalibration(songId, bpm, null, true);
      msg = 'Measured ' + fmtBpm(bpm) + ' BPM. Beat 1 could not be pinned down'
        + (phase ? ' (the track does not start promptly)' : '')
        + ' — tap once on beat 1.';
    }
    if (tempo.spread !== null && tempo.spread > 1.5) {
      msg += ' Tempo drifts by about ' + tempo.spread.toFixed(1) + ' BPM, so the count will slide late in the track.';
    }
    renderPlaylist();
    setAnalyzeStatus(msg, 'ok');
  } catch (err) {
    var nm = err && err.name;
    if (nm === 'NotAllowedError' || nm === 'AbortError') {
      setAnalyzeStatus('Screen share was dismissed, so nothing was measured.');
    } else {
      setAnalyzeStatus('Calibration failed: ' + ((err && err.message) || nm || 'unknown error'), 'warn');
    }
  } finally {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
    analyzing = false;
    btn.classList.remove('busy');
  }
}

document.getElementById('analyzeBtn').addEventListener('click', analyzeAudio);
document.getElementById('calibrateBtn').addEventListener('click', autoCalibrate);

/* ---- Playlist ---- */
function renderPlaylist() {
  var list = document.getElementById('songList');
  list.innerHTML = '';
  SONGS.forEach(function (s, i) {
    var d = document.createElement('div');
    d.className = 'song-item' + (i === activeSong ? ' active' : '');
    var cal = loadCalibration(s.ytId);
    var calMark = cal ? ' <span style="color:var(--hit);font-size:.6rem" title="Calibrated: ' + cal.bpm + ' BPM">&#9679;</span>' : '';
    d.innerHTML = '<span class="song-num">' + (i + 1) + '</span>' +
      '<div class="song-info"><div class="song-name">' + s.title + calMark + '</div>' +
      '<div class="song-artist">' + s.artist + '</div></div>' +
      '<span class="song-dur">' + s.dur + '</span>';
    d.addEventListener('click', function () { playSong(i); });
    list.appendChild(d);
  });
  var active = list.querySelector('.song-item.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---- Init ---- */
beatDur = 60 / bpm;
renderPlaylist();
renderWaveform();
</script>
